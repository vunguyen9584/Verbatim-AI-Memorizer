server {
    # Lắng nghe trên cổng 80 bên trong container
    listen 80;

    # Thư mục gốc chứa các file của bạn
    root /usr/share/nginx/html;
    index index.html;

    # Cấu hình quan trọng cho các ứng dụng SPA (React, Vue, etc.)
    # Nó đảm bảo rằng mọi request sẽ được chuyển về index.html
    # để bộ định tuyến phía client có thể xử lý.
    location / {
        try_files $uri $uri/ /index.html;
    }
}